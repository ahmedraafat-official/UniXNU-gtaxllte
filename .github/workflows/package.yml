name: package

# The example's copy of the packaging action (docs/porting/packaging.md). Replace the
# firmware repository below with this board's; the device name appears in the artifact
# paths. The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and is
# baked into the images, so the run's artifacts belong to one device alone: download
# them, then delete the run. Run it in a fork of the device repository.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17"]
        default: "17"
      prelink:
        description: "Build the prelinked kernel (the native images are the default)"
        type: boolean
        default: false
      userdata:
        description: "Also build the USERDATA root image (OS/SystemOS windows)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          # Pin the tool that the device patches apply to. Main advanced on
          # 2026-11-15 16:58 UTC and changed scripts/unixnu/bootimg.py.
          ref: 75904b1a8ce19d30b91042e25b815d5a1e3b8525
          path: unixnu
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: Project-Silicium/Mu-Silicium
          path: uefi-gtaxllte
          submodules: recursive   # the firmware volume builds from the checkout's submodules
      # Remove this pair once UniXNU-exynos7870-common is published and
      # feeds.toml carries its real URL.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/UniXNU-exynos7870-common
          path: UniXNU-exynos7870-common
      - name: local SoC feed
        run: |
          cat > device/local.toml <<'EOF'
          [[source]]
          name = "exynos7870"
          kind = "soc"
          local = "../UniXNU-exynos7870-common"
          EOF
      - name: prelink patch set
        # The prelinked kernel carries the real kext collection; the native
        # crypto/trust-cache/UUID workarounds and the eMMC probe must not be
        # applied to it. Keep the early framebuffer bars, the NULL-safe kmem
        # wrapper and the crypto-free UUID: both are reached before the kexts
        # start. The IOKit trace squares name the exact hang point.
        if: ${{ inputs.prelink }}
        run: |
          cat > device/patches/xnu/series <<'EOF'
          # Prelinked kernel: native-only workarounds are omitted. The early
          # framebuffer, the IOKit trace squares and the read-only eMMC probe
          # are diagnostics. The crypto-free platform UUID and the NULL-safe
          # kmem wrapper are still needed: ConfigureIOKit() and the kmem zones
          # run before the corecrypto kext has registered its provider.
          zzz-kmem-no-crypto.patch
          zzz-native-uuid.patch
          zzz-panic-framebuffer.patch
          zzz-iokit-bar.patch
          zzz-emmc-probe.patch
          zzz-iokit-trace.patch
          zzz-boot-trace.patch
          zzz-emmc-early.patch
          zzz-max-cpus.patch
          zzz-native-dwmmc-personality.patch
          zzz-root-probe.patch
          EOF
      - name: native config audit
        # Fail before the 40-minute build if the defconfig still assumes the
        # prelinked kext collection that --skip-prelink never maps.
        if: ${{ !inputs.prelink }}
        run: python3 device/scripts/check-native-config.py device/configs/gtaxllte_defconfig --board device/board.toml
      - name: patch UniXNU boot image
        run: |
          git -C unixnu apply "$GITHUB_WORKSPACE/device/patches/unixnu/0001-bootimg-gtaxllte.patch"
          git -C unixnu apply "$GITHUB_WORKSPACE/device/patches/unixnu/0002-payload-strip.patch"
          git -C unixnu apply "$GITHUB_WORKSPACE/device/patches/unixnu/0003-payload-fat16.patch"
          git -C unixnu apply "$GITHUB_WORKSPACE/device/patches/unixnu/0004-xnu-native-dwmmc.patch"
          git -C unixnu apply "$GITHUB_WORKSPACE/device/patches/unixnu/0005-adt-before-strip.patch"
          git -C unixnu apply "$GITHUB_WORKSPACE/device/patches/unixnu/0006-adt-cells.patch"
          git -C unixnu apply "$GITHUB_WORKSPACE/device/patches/unixnu/0007-adt-phandle.patch"
          git -C unixnu apply "$GITHUB_WORKSPACE/device/patches/unixnu/0008-owner-data-bringup.patch"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: skip optional boot-progress patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for series in Path("unixnu/profiles").rglob("patches/xnu/series"):
              series.write_text("".join(line for line in series.read_text().splitlines(True) if "zzz-boot-progress" not in line))
          PY
      - name: tools
        run: |
          brew install dtc llvm lld cmake ninja mtools unifdef acpica blacktop/tap/ipsw
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy unifdef iasl ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: userdata image
        # Optional and separate from the kernel: the image is ~5 GiB and only
        # written to the tablet with explicit approval. The package step stops
        # at strip, so build it first.
        if: ${{ inputs.userdata }}
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          IASL_PREFIX: /opt/homebrew/bin/
          UNIXNU_DTB: ../uefi-gtaxllte/Resources/DTBs/gtaxllte.dtb
        run: |
          python3 ../unixnu/unixnu build userdata -D . --os "${{ inputs.os }}"
      - name: display reference kernel
        # The Legacy display ABI audit needs this profile's prelinked layout.
        # Build the kernel once with the bootstrap probe archive, then the
        # package step rebuilds the display archive against that reference and
        # relinks the final kernel.
        if: ${{ inputs.prelink }}
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          IASL_PREFIX: /opt/homebrew/bin/
          UNIXNU_DTB: ../uefi-gtaxllte/Resources/DTBs/gtaxllte.dtb
        run: |
          python3 ../unixnu/unixnu defconfig gtaxllte_defconfig -D . --os "${{ inputs.os }}"
          python3 ../unixnu/unixnu build kernel -D . --os "${{ inputs.os }}"
          test -n "$(find ../unixnu/out/gtaxllte -path '*/kernel/kernel.macho' -print -quit)"
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          IASL_PREFIX: /opt/homebrew/bin/
          UNIXNU_DTB: ../uefi-gtaxllte/Resources/DTBs/gtaxllte.dtb
        run: |
          if [ "${{ inputs.prelink }}" = "true" ]; then
            scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-gtaxllte --edk2 ../uefi-gtaxllte/Mu_Basecore
          else
            scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-gtaxllte --edk2 ../uefi-gtaxllte/Mu_Basecore --skip-prelink
          fi
      - name: bring-up payload
        # The package step stops at strip on the 49 MiB prelinked Mach-O. Build
        # the payload stage separately with the committed Data seed and the
        # original static+System trust bundle, so the HIDDEN image carries the
        # exact kernel.macho, ADT, trust cache, seed and menu config.
        if: ${{ always() && inputs.prelink }}
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          IASL_PREFIX: /opt/homebrew/bin/
          UNIXNU_DTB: ../uefi-gtaxllte/Resources/DTBs/gtaxllte.dtb
        run: |
          python3 ../unixnu/unixnu build payload -D . --os "${{ inputs.os }}" --uefi ../uefi-gtaxllte \
            --data-ramdisk data/owner-data-8g.dbr \
            --trust-cache data/original-static-system.bundle
      - name: build logs
        # The archive and kernel logs hold the full compiler diagnostics when a
        # build step fails; the GitHub step log can truncate long compile output.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          retention-days: 1
          if-no-files-found: warn
          path: unixnu/out/gtaxllte/*/*/logs/*.log
      - name: display kernel audit
        # The first kernel pass carries only the bootstrap probe archive; make
        # sure the artifact is the rebuilt kernel, not that reference, before
        # it can be flashed.
        if: ${{ always() && inputs.prelink }}
        run: |
          K=$(find unixnu/out/gtaxllte -path '*/kernel/kernel.macho' -print -quit)
          test -n "$K"
          strings "$K" | grep -q 'NativeLegacyDisplay: leaf=' || {
            echo 'the prelinked kernel has no display backend; refusing the artifact' >&2
            exit 1
          }
          P=$(find unixnu/out/gtaxllte -path '*/kernel/kernel.json' -print -quit)
          test -n "$P"
          python3 - "$P" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          family = 'com.apple.iokit.IOMobileGraphicsFamily'
          extents = [entry for entry in plan['extents'] if entry['module'] == family]
          assert extents, 'the prelink plan has no IOMobileGraphicsFamily'
          print('display family extents:', extents)
          PY
      - name: boot image artifact
        # The native kernel still runs the display stub, but this artifact
        # carries the current board.toml kernel args in its payload config.
        # Upload it before the native prelink audit can fail on the storage
        # driver's recorded absolute kext symbols.
        if: ${{ always() && !inputs.prelink }}
        uses: actions/upload-artifact@v4
        with:
          name: boot-image
          retention-days: 1
          if-no-files-found: error
          path: |
            unixnu/out/gtaxllte/*/*/boot/boot.img
            unixnu/out/gtaxllte/*/*/payload/payload.img
      - name: native prelink audit
        # A --skip-prelink kernel does not map the target's kernelcache. Any
        # external absolute symbol in prelink space is a boot-time fault
        # (NativeAES/IOAESAccelerator was the first one); fail before flashing.
        if: ${{ !inputs.prelink }}
        run: |
          K=$(find unixnu/out/gtaxllte -path '*/kernel/kernel.macho' -print -quit)
          test -n "$K"
          python3 device/scripts/check-native-prelink-refs.py "$K"
      - name: prelinked kernel
        # The 49 MiB kernel does not fit the 14 MiB ramdisk, so the package
        # step stops at the payload. The kernel is built before that and is
        # what we write to the HIDDEN partition.
        if: ${{ always() && inputs.prelink }}
        uses: actions/upload-artifact@v4
        with:
          name: prelinked-kernel
          retention-days: 1
          if-no-files-found: warn
          path: |
            unixnu/out/gtaxllte/*/*/kernel/kernel.macho
            unixnu/out/gtaxllte/*/*/payload/stage/EFI/UniXNU/Payloads/kernel.macho
            unixnu/out/gtaxllte/*/*/payload/stage/EFI/UniXNU/Payloads/kernel.macho.adt
            unixnu/out/gtaxllte/*/*/payload/stage/EFI/UniXNU/Payloads/kernel.macho.trustcache
            unixnu/out/gtaxllte/*/*/payload/stage/EFI/UniXNU/Payloads/scratch-data.img
            unixnu/out/gtaxllte/*/*/payload/stage/EFI/UniXNU/unixnu.toml
            unixnu/out/gtaxllte/*/*/kernel/kernel.json
            unixnu/out/gtaxllte/*/*/kernel/kernel.map.json
      - name: userdata artifact
        if: ${{ always() && inputs.userdata }}
        uses: actions/upload-artifact@v4
        with:
          name: userdata-image
          retention-days: 1
          if-no-files-found: warn
          path: unixnu/out/gtaxllte/*/*/userdata/userdata-root.img
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            unixnu/out/gtaxllte/*/*/boot/boot.img
            unixnu/out/gtaxllte/*/*/payload/payload.img
            unixnu/out/gtaxllte/*/*/kernel/kernel.macho
            unixnu/out/gtaxllte/*/*/package.manifest.json
