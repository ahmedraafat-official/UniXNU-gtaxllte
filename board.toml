schema_version = 2

# Board description of the Samsung Galaxy Tab A 10.1 (2016) LTE, SM-T585,
# codename gtaxllte (S5E7870 / Exynos 7870). Read by the unixnu build driver.
#
# The values here come from two public sources until the tablet's own dump is
# collected: Mu-Silicium's gtaxllte UEFI port (memory map, FD base, display
# framebuffer) and the mainline Linux 7.x Exynos 7870 gtaxlwifi device tree
# (memory banks, secure hole, PMIC/touch wiring). PHASE0.md explains the dump
# that replaces every "verify" note with measured values.

[board]
name = "gtaxllte"
soc = "Exynos 7870"
soc_source = "exynos7870"
os_profile = "ipados-17.7.11-21H461"
description = "Samsung Galaxy Tab A 10.1 (2016) LTE (SM-T585)"
kit = "gtaxllte"

[components]
# SoftwareAES is deliberately absent: it subclasses IOAESAccelerator, a class
# that exists only in the target's prelinked kext collection. A native
# (--skip-prelink) kernel never maps that collection, so NativeAES::superClass
# and four of its method slots point into unmapped prelink space and the kernel
# panics in OSMetaClass::postModLoad. Revisit when a prelinked payload fits BOOT
# or the kext collection is mapped by the native kernel.
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "gtaxllte_defconfig"
# Overrides the arch profile's list to drop component:SoftwareAES and
# build-software-aes-bindings.py (arrays replace, they do not merge).
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "build-native-dwmmc.py",
]
# The shared ARM64 fragment selects ArmCpu and the architectural timer. The
# SoC fragment turns PAN off: the Cortex-A53s are ARMv8.0.
config_fragments = ["arch:configs/common.config", "soc:configs/exynos7870.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[kernel.prelink]
# The full iPad7,1 roots pull display/GPU/media kexts that wait for Apple
# hardware on this Exynos board. Keep the software/security/storage closure and
# the platform/PMGR kexts; the native ArmCpu owns /cpus after the AppleARMCPU
# IONameMatch is rewritten from cpu to xpu in the prelinked kernel.
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
]

[device_tree]
source = "device:dts/gtaxllte.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "gtaxllte"
dsc = "Platforms/Samsung/gtaxlltePkg/gtaxllte.dsc"
fd = "Build/gtaxlltePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
# Adds UniXNU, UniXNUDxe, UniXNURamDiskDxe and DarwinBoot to the upstream
# gtaxllte package behind UNIXNU_PAYLOAD. The patch is idempotent.
preflight = ["scripts/patch-gtaxllte-uefi.py"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Samsung",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{edk2}",
  "{uefi}/Silicon/Samsung",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Samsung",
  "{uefi}/Silicium-ACPI/Silicon/Samsung",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
]

[firmware.defines]
BUILDID_STRING = "gtaxllte-research"
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
UNIXNU_PAYLOAD = "1"

[bootimg.image]
# Resources/Configs/gtaxllte.toml in Mu-Silicium: Android header v1,
# requires_kernel_header, FD base 0x43E00000, FD size 0x200000.
# Samsung S-Boot loads the kernel at base + kernel_offset and expects the
# 2048-byte page layout; the UniXNU defaults are for fastboot devices.
base = 0x10000000
kernel_offset = 0x8000
tags_offset = 0x100
pagesize = 2048
header_version = 1

[payload]
volume = "GTAXLLTE"
# The payload is UEFI-compressed because BOOT is small. 16 MiB held the
# hero2lte kernel; the Tab A's BOOT size is confirmed in PHASE0.md before the
# first flash. Raise this only after reading /dev/block/by-name/boot's size.
size_mib = 14
compress = "uefi"
loader = "firmware"
title = "UniXNU"
# A long countdown while the payload path is under bring-up: the menu is the
# only place that reports whether the FAT volume and config were found.
timeout = 30
kernel_args = ["-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "fips_mode=4", "armcpu-diagnostics=1", "-no_slto_panic"]
# Draw the XNU entry bars and a panic screen on the firmware framebuffer. The
# tablet has no accessible UART, so this is the M2 log route.
panic_screen = true
strip = true

[package]
unixnu = "../unixnu"

[package.defconfig]
"ipados-17.7.11-21H461" = "gtaxllte_defconfig"

[payload.adt]
# The same iPadOS 17.7.11 profile identity seed used by the other ports. The
# per-build platform seed is supplied with --unique-chip-id.
chip_id = "207"
unique_chip_id = "required"
# XNU takes one contiguous owned window. In the UEFI memory map the largest
# free run in the second bank is 0x90014000-0xAE600000 (about 470 MiB), so
# 448 MiB fits with margin. Freeing the unused ION heaps in the UEFI map is
# milestone M4; until then do not raise this past 0x1D000000.
owned_memory_size = "0x1C000000"
